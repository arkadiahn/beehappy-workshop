apiVersion: 1

providers:
  - name: beehappy
    orgId: 1
    folder: BeeHappy
    type: file
    disableDeletion: false
    # Re-read the JSON periodically so an edited file shows up without a
    # restart. allowUiUpdates lets people tweak panels in the browser; those
    # edits live in Grafana's own database, so the service needs a volume for
    # them to survive a redeploy.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
