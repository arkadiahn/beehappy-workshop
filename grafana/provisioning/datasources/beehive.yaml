apiVersion: 1

# Connects over Railway's private network, so the database is never reached
# across the public internet and no egress is billed. The values come from
# environment variables set on the Grafana service as Railway reference
# variables (${{beehive-db.PGHOST}} and friends), so no credential is in git.
datasources:
  - name: beehive-db
    uid: beehive
    type: postgres
    access: proxy
    url: $BEEHIVE_DB_HOST:$BEEHIVE_DB_PORT
    user: $BEEHIVE_DB_USER
    database: $BEEHIVE_DB_NAME
    isDefault: true
    editable: false
    secureJsonData:
      password: $BEEHIVE_DB_PASSWORD
    jsonData:
      # Private network inside Railway; Railway's Postgres image does not
      # serve TLS on it, and the traffic never leaves their network.
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
