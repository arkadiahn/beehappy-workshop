[project]
name = "beehappy-workshop"
version = "0.1.0"
description = "Data Foundation workshop: turning raw BeeHappy beehive sensor tables into one ML-ready dataframe"
readme = "README.md"
requires-python = ">=3.13"

# What a student needs. `uv sync` alone is enough to open the notebook and work
# through every exercise -- no extras, no database, no credentials.
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    # Parquet engine. The snapshot ships as Parquet so dtypes and timestamps
    # survive the round trip, which CSV would not guarantee.
    "pyarrow>=18.0.0",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# Only the instructor needs this, and only to re-cut the snapshot from the live
# database:  uv sync --extra export
export = [
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
default-groups = ["dev"]
