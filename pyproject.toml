[project]
name = "the-bees"
version = "0.1.0"
description = "ETL pipeline loading the Bildungscampus Digital Beehive API into PostgreSQL"
readme = "README.md"
requires-python = ">=3.13"

# Kept deliberately small: this is what the Railway cron container installs.
# psycopg[binary] ships its own libpq, so the image needs no system Postgres.
dependencies = [
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Notebook / data-analysis stack. Not installed in the deployed container.
#   uv sync --extra analysis
analysis = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
# Local development gets the analysis stack by default; the Dockerfile passes
# --no-default-groups --no-editable to skip it.
default-groups = ["dev"]
